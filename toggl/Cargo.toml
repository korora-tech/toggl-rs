[package]
name = "toggl"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Rust client library for Toggl Track APIs - main entry point"
readme = "../README.md"
keywords = ["toggl", "api", "client", "time-tracking"]
categories = ["api-bindings", "web-programming"]

[features]
# Default features - no clients enabled by default, only models
default = []

# Individual client features
api-client = ["toggl-api/client"]
reports-client = ["toggl-reports/client"]
webhooks-client = ["toggl-webhooks/client"]

[dependencies]
toggl-core = { workspace = true }
# Models are always included, clients are feature-gated
toggl-api = { workspace = true }
toggl-reports = { workspace = true }
toggl-webhooks = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]